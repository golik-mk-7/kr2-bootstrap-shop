<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка – Marydivita Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #ffb271 !important; color: #673a09 !important; font-family: Georgia, "Times New Roman", serif; }
        h1, h2, h3, h4, h5, .navbar-brand { color: #000 !important; }
        .bg-dark { background-color: #ef9950 !important; }
        .navbar-dark .navbar-nav .nav-link { color: #673a09 !important; text-decoration: underline; }
        .navbar-dark .navbar-nav .nav-link.active { color: #000 !important; font-weight: bold; }
        .btn-primary { background-color: #f50909 !important; border-color: #f50909 !important; border-radius: 999px !important; color: #ef9950 !important; font-weight: bold; transition: 0.3s;}
        .btn-primary:hover { background-color: #c40707 !important; color: #fff !important;}
        .card { background-color: #ef9950 !important; border: 1px solid #673a09 !important; }
        .card-header { background-color: #f50909 !important; color: #ef9950 !important; border-bottom: 1px solid #673a09; font-weight: bold;}
        .form-control, .form-select { background-color: transparent; border: none; border-bottom: 1px solid #673a09; border-radius: 0; color: #673a09; }
        .form-control:focus, .form-select:focus { box-shadow: none; border-bottom: 2px solid #f50909; }
        .form-check-input:checked { background-color: #f50909; border-color: #f50909; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Marydivita</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
                    <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header"><h1 class="h4 mb-0">Оформление заявки</h1></div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">Ваше имя *</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Телефон *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-0 border-bottom border-dark" style="color: #673a09;">+7</span>
                                    <input type="tel" class="form-control" id="phone" placeholder="900 000-00-00" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="cat" class="form-label">Выберите котёнка</label>
                                <select class="form-select" id="cat">
                                    <option selected>Выберите...</option>
                                    <option value="1">Британская шиншилла (100 000 руб)</option>
                                    <option value="2">Шотландский колорпоинт (150 000 руб)</option>
                                    <option value="3">Абиссинский соррель (200 000 руб)</option>
                                    <option value="4">Абиссинский дикий (250 000 руб)</option>
                                    <option value="5">Бенгальский (300 000 руб)</option>
                                    <option value="6">Бурма шоколадная (350 000 руб)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="comment" class="form-label">Комментарий</label>
                                <textarea class="form-control" id="comment" rows="3"></textarea>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agree" required>
                                <label class="form-check-label" for="agree">Я согласен на обработку персональных данных *</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Отправить заявку</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-center py-4 mt-5"><p class="mb-0 text-dark fw-bold">&copy; 2026 Питомник Marydivita.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
